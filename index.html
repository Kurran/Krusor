
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krusor</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      color-scheme: dark;
    }

    h1,
    .takeoff-button {
      color: #7de5ff;
      font-family: "Arial Black", Arial, sans-serif;
      font-style: italic;
      font-weight: 900;
      text-shadow: 0 0 0.15em #00b7ff, 0 0 0.45em #0066ff;
    }

    h1 {
      text-align: center;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    .video-stage {
      position: relative;
    }

    .video-stage video {
      display: block;
      max-width: 100%;
      height: auto;
      margin-inline: auto;
    }

    .takeoff-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: calc(100% - 2rem);
      padding: 0.55em 0.9em;
      border: 1px solid #7de5ff;
      border-radius: 0.4em;
      background: rgb(0 0 0 / 75%);
      font-size: clamp(1.25rem, 4vw, 2.5rem);
      cursor: pointer;
    }

    .takeoff-button:hover,
    .takeoff-button:focus-visible {
      background: #10232c;
    }
  </style>
</head>
<body>
  <h1>Welcome to Krusor Airlines</h1>
  <div class="video-stage">
    <video id="homepage-video" playsinline loop disablepictureinpicture preload="auto">
      <source src="./1108.mp4" type="video/mp4">
      <p><a href="./1108.mp4">Download the Lamborghini video</a>.</p>
    </video>
    <button class="takeoff-button" id="takeoff-button" type="button">Prepare for Take-Off..</button>
  </div>
  <script>
    const video = document.getElementById("homepage-video");
    const takeoffButton = document.getElementById("takeoff-button");
    video.volume = 1;

    async function startVideo(event) {
      if (!video.paused || event.target.closest("a")) {
        return;
      }

      try {
        await video.play();
        takeoffButton.hidden = true;
        document.removeEventListener("click", startVideo);
      } catch (error) {
        console.warn("Video playback failed:", error);
      }
    }

    document.addEventListener("click", startVideo);
  </script>
</body>
</html>
