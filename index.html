
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krusor</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      color-scheme: dark;
    }

    h1 {
      text-align: center;
      color: #7de5ff;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-style: italic;
      font-weight: 900;
      text-shadow: 0 0 0.15em #00b7ff, 0 0 0.45em #0066ff;
    }

    #play-video:not([hidden]) {
      display: block;
      margin: 1rem auto 0;
    }
  </style>
</head>
<body>
  <h1>Welcome to Krusor</h1>
  <video id="homepage-video" autoplay playsinline loop disablepictureinpicture style="display: block; max-width: 100%; height: auto; margin-inline: auto;">
    <source src="./1108.mp4" type="video/mp4">
    <p><a href="./1108.mp4">Download the Lamborghini video</a>.</p>
  </video>
  <button id="play-video" type="button" hidden>Play with sound</button>
  <script>
    const video = document.getElementById("homepage-video");
    const playButton = document.getElementById("play-video");

    video.volume = 1;

    async function playVideo() {
      try {
        await video.play();
        playButton.hidden = true;
      } catch (error) {
        if (error.name === "NotAllowedError") {
          playButton.hidden = false;
        }
      }
    }

    playButton.addEventListener("click", playVideo);
    playVideo();
  </script>
</body>
</html>
